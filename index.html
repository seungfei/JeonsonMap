<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량 관리 시스템</title>
  <!-- Supabase 라이브러리 불러오기 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #4a90e2;
      --danger: #e74c3c;
      --secondary: #6c757d;
      --bg: #f4f7f6;
    }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: var(--bg);
      margin: 0; padding: 20px;
    }
    
    input, button, textarea {
      padding: 10px; border: 1px solid #ddd; border-radius: 5px;
      box-sizing: border-box; font-family: inherit;
    }
    button {
      background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold;
    }
    button.danger { background-color: var(--danger); }
    button.secondary { background-color: var(--secondary); }
    button:hover { opacity: 0.9; }
    button:disabled { background-color: #aaa; cursor: not-allowed; }

    header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
      flex-wrap: wrap; gap: 10px;
    }
    .header-btns { display: flex; gap: 10px; }

    #no-connection-msg {
      text-align: center; padding: 60px 20px; background: white; border-radius: 8px;
      color: #666; box-shadow: 0 2px 5px rgba(0,0,0,0.05); line-height: 1.6;
    }

    #vehicle-list { display: none; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card h2 { margin: 0 0 15px 0; font-size: 1.2rem; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem; margin-bottom: 15px; }
    .d-day-alert { color: var(--danger); font-weight: bold; }
    
    .thread-section { border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px; }
    .thread-list { max-height: 250px; overflow-y: auto; margin-bottom: 10px; }
    .thread-item { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; font-size: 0.85rem; }
    .thread-item img { max-width: 100%; border-radius: 4px; margin-top: 5px; }
    .thread-input-group { display: flex; flex-direction: column; gap: 5px; }
    .thread-input-group textarea { resize: vertical; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: white; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%;
    }
    .modal-content input, .modal-content button { width: 100%; margin: 5px 0 15px; }
    .modal-content label { font-size: 0.85rem; font-weight: bold; display: block; margin-top: 5px; }
  </style>
</head>
<body>

  <header>
    <h1 style="margin: 0;">차량 관리 시스템</h1>
    <div class="header-btns">
      <button class="secondary" onclick="openSettings()">⚙️ 환경설정</button>
      <button onclick="openAddVehicleModal()">+ 차량 등록</button>
    </div>
  </header>

  <!-- 데이터베이스 미연결 안내 화면 -->
  <div id="no-connection-msg">
    <h3>데이터베이스가 연결되지 않았습니다.</h3>
    <p>우측 상단의 <b>[⚙️ 환경설정]</b> 버튼을 눌러 연결 정보를 입력해주세요.</p>
  </div>

  <!-- 차량 목록 화면 -->
  <div id="vehicle-list"></div>

  <!-- 환경설정 모달 -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">⚙️ 데이터베이스 연결 설정</h3>
      <label>데이터베이스 주소 (URL)</label>
      <input type="text" id="configUrl" placeholder="예: https://xxxxxx.supabase.co" autocomplete="off">
      <label>보안 인증 키 (Anon Key)</label>
      <input type="password" id="configKey" placeholder="긴 영문과 숫자 조합의 키 입력" autocomplete="off">
      <button id="connectBtn" onclick="connectSupabase()">연결 및 저장</button>
      <div style="display: flex; gap: 10px; margin-top: -5px;">
        <button class="danger" style="margin-bottom: 0;" onclick="disconnectSupabase()">연결 해제</button>
        <button class="secondary" style="margin-bottom: 0;" onclick="closeModal('settingsModal')">닫기</button>
      </div>
    </div>
  </div>

  <!-- 차량 등록 모달 -->
  <div id="addVehicleModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">신규 차량 등록</h3>
      <label>차량번호</label>
      <input type="text" id="vPlate" placeholder="예: 12가 3456" required>
      <label>차종</label>
      <input type="text" id="vModel" placeholder="예: 아반떼, i30 등" required>
      <label>연식</label>
      <input type="text" id="vYear" placeholder="예: 2010" required>
      <label>색상</label>
      <input type="text" id="vColor" placeholder="예: 쥐색, 흰색" required>
      <label>보험사</label>
      <input type="text" id="vInsuranceCo" placeholder="예: 삼성화재">
      <label>보험 만기일자</label>
      <input type="date" id="vInsuranceExp" required>
      <label>자동차검사 유효기간</label>
      <input type="date" id="vInspectionExp" required>
      <button onclick="addVehicle()">등록하기</button>
      <button class="danger" style="margin-bottom: 0;" onclick="closeModal('addVehicleModal')">취소</button>
    </div>
  </div>

  <!-- 만기 알림 모달 -->
  <div id="dDayAlertModal" class="modal">
    <div class="modal-content" style="border-left: 5px solid var(--danger);">
      <h3 style="margin-top:0;">⚠️ 만기 임박 알림</h3>
      <div id="alertMessages" style="margin-bottom: 15px; line-height: 1.5;"></div>
      <button class="danger" style="margin-bottom: 0;" onclick="closeModal('dDayAlertModal')">확인</button>
    </div>
  </div>

  <script>
    // 💡 변수 이름을 라이브러리(supabase)와 충돌하지 않도록 supabaseClient로 변경했습니다.
    let supabaseClient = null;

    document.addEventListener("DOMContentLoaded", () => {
      const savedUrl = localStorage.getItem('supaUrl');
      const savedKey = localStorage.getItem('supaKey');
      if (savedUrl && savedKey) {
        initSupabase(savedUrl, savedKey, false);
      }
    });

    function openSettings() {
      document.getElementById('configUrl').value = localStorage.getItem('supaUrl') || '';
      document.getElementById('configKey').value = localStorage.getItem('supaKey') || '';
      openModal('settingsModal');
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function openAddVehicleModal() {
      if (!supabaseClient) return alert('먼저 [⚙️ 환경설정]에서 데이터베이스를 연결해주세요.');
      openModal('addVehicleModal');
    }

    async function connectSupabase() {
      const url = document.getElementById('configUrl').value.trim();
      const key = document.getElementById('configKey').value.trim();
      
      if (!url || !key) return alert('데이터베이스 주소와 인증 키를 모두 입력해주세요.');
      if (!url.startsWith('http')) return alert('주소는 https:// 로 시작해야 합니다.');

      const btn = document.getElementById('connectBtn');
      btn.innerText = '연결 확인 중...';
      btn.disabled = true;
      
      await initSupabase(url, key, true);
      
      btn.innerText = '연결 및 저장';
      btn.disabled = false;
    }

    async function initSupabase(url, key, showAlert) {
      try {
        if (!window.supabase) {
          throw new Error('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결 상태를 확인하세요.');
        }

        // 라이브러리의 createClient 기능 사용
        const tempClient = window.supabase.createClient(url, key);
        const { error } = await tempClient.from('vehicles').select('id').limit(1);
        if (error) throw error; 

        supabaseClient = tempClient; // 에러 없이 검증되면 저장
        localStorage.setItem('supaUrl', url);
        localStorage.setItem('supaKey', key);
        
        document.getElementById('no-connection-msg').style.display = 'none';
        document.getElementById('vehicle-list').style.display = 'grid';
        
        closeModal('settingsModal');
        if (showAlert) alert('성공적으로 연결되었습니다!');
        
        loadVehicles(); 
      } catch (err) {
        console.error("연결 에러:", err);
        supabaseClient = null;
        let errorMsg = err.message || "알 수 없는 오류";
        
        if (showAlert) {
          if (errorMsg.includes('does not exist')) {
            alert(`연결 실패: 데이터베이스에 차량 테이블이 없습니다.\nSupabase SQL Editor에서 테이블을 먼저 생성해주세요.`);
          } else if (errorMsg.includes('Failed to fetch') || errorMsg.includes('URL')) {
            alert(`연결 실패: 잘못된 데이터베이스 주소입니다.`);
          } else if (errorMsg.includes('JWT')) {
            alert(`연결 실패: 인증 키가 잘못되었습니다.`);
          } else {
            alert(`연결 실패:\n${errorMsg}`);
          }
        }
        showNoConnectionUI();
      }
    }

    function disconnectSupabase() {
      if(!localStorage.getItem('supaUrl')) return alert('연결된 데이터베이스가 없습니다.');
      if(!confirm('연결을 해제하시겠습니까? 데이터는 삭제되지 않습니다.')) return;

      localStorage.removeItem('supaUrl');
      localStorage.removeItem('supaKey');
      supabaseClient = null;
      
      closeModal('settingsModal');
      showNoConnectionUI();
      alert('연결이 해제되었습니다.');
    }

    function showNoConnectionUI() {
      document.getElementById('no-connection-msg').style.display = 'block';
      document.getElementById('vehicle-list').style.display = 'none';
      document.getElementById('vehicle-list').innerHTML = '';
    }

    function getDDay(dateString) {
      if (!dateString) return null;
      const targetDate = new Date(dateString);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.ceil((targetDate - today) / (1000 * 60 * 60 * 24));
    }

    function formatDDay(dDay) {
      if (dDay === null) return '-';
      if (dDay === 0) return 'D-Day';
      if (dDay > 0) return `D-${dDay}`;
      return `D+${Math.abs(dDay)} (만료)`;
    }

    async function loadVehicles() {
      if (!supabaseClient) return;
      const { data: vehicles, error } = await supabaseClient.from('vehicles').select('*').order('created_at', { ascending: false });
      if (error) return alert('차량 정보를 불러오는 중 오류가 발생했습니다.');

      const listDiv = document.getElementById('vehicle-list');
      listDiv.innerHTML = '';
      let alerts = [];

      for (const v of vehicles) {
        const insDDay = getDDay(v.insurance_exp);
        const inspDDay = getDDay(v.inspection_exp);

        if (insDDay !== null && insDDay >= 0 && insDDay <= 10) alerts.push(`${v.plate} (${v.model})의 <b>보험 만기</b>가 ${insDDay === 0 ? '오늘입니다' : insDDay + '일 남았습니다'}.`);
        if (inspDDay !== null && inspDDay >= 0 && inspDDay <= 10) alerts.push(`${v.plate} (${v.model})의 <b>자동차검사 기한</b>이 ${inspDDay === 0 ? '오늘입니다' : inspDDay + '일 남았습니다'}.`);

        const insClass = (insDDay !== null && insDDay <= 10) ? 'd-day-alert' : '';
        const inspClass = (inspDDay !== null && inspDDay <= 10) ? 'd-day-alert' : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h2>${v.plate} <span style="font-size:0.9rem; color:#666;">(${v.model} / ${v.year} / ${v.color})</span></h2>
          <div class="info-grid">
            <div><strong>보험사:</strong> ${v.insurance_co || '-'}</div>
            <div><strong>보험 만기:</strong> <span class="${insClass}">${v.insurance_exp || '-'} (${formatDDay(insDDay)})</span></div>
            <div style="grid-column: 1 / -1;"><strong>자동차검사:</strong> <span class="${inspClass}">${v.inspection_exp || '-'} (${formatDDay(inspDDay)})</span></div>
          </div>
          <div class="thread-section">
            <strong>특이사항 이력</strong>
            <div id="threads-${v.id}" class="thread-list">로딩중...</div>
            <div class="thread-input-group">
              <textarea id="note-text-${v.id}" rows="2" placeholder="정비 내역 등을 기록하세요..."></textarea>
              <input type="file" id="note-file-${v.id}" accept="image/*">
              <button onclick="addNote(event, '${v.id}')">기록 저장</button>
            </div>
          </div>
          <button class="danger" style="width:100%; margin-top:15px;" onclick="deleteVehicle('${v.id}')">매각/삭제 처리</button>
        `;
        listDiv.appendChild(card);
        loadNotes(v.id);
      }

      if (alerts.length > 0) {
        document.getElementById('alertMessages').innerHTML = alerts.join('<br><br>');
        openModal('dDayAlertModal');
      }
    }

    async function addVehicle() {
      if (!supabaseClient) return alert('데이터베이스가 연결되어 있지 않습니다.');
      
      const v = {
        plate: document.getElementById('vPlate').value,
        model: document.getElementById('vModel').value,
        year: document.getElementById('vYear').value,
        color: document.getElementById('vColor').value,
        insurance_co: document.getElementById('vInsuranceCo').value,
        insurance_exp: document.getElementById('vInsuranceExp').value,
        inspection_exp: document.getElementById('vInspectionExp').value
      };
      
      if(!v.plate || !v.model) return alert('차량번호와 차종은 필수입니다.');

      const { error } = await supabaseClient.from('vehicles').insert([v]);
      if (error) {
        alert('등록 실패! 콘솔을 확인해주세요.');
      } else {
        closeModal('addVehicleModal');
        document.querySelectorAll('#addVehicleModal input').forEach(el => el.value = '');
        loadVehicles();
      }
    }

    async function deleteVehicle(id) {
      if (!supabaseClient) return;
      if (!confirm('차량 정보를 삭제하시겠습니까? 관련된 특이사항 스레드도 모두 삭제됩니다.')) return;
      
      const { error } = await supabaseClient.from('vehicles').delete().eq('id', id);
      if (!error) loadVehicles();
    }

    async function loadNotes(vehicleId) {
      if (!supabaseClient) return;
      const { data: notes, error } = await supabaseClient.from('vehicle_notes').select('*').eq('vehicle_id', vehicleId).order('created_at', { ascending: true });
      const container = document.getElementById(`threads-${vehicleId}`);
      if (error) { container.innerHTML = '불러오기 실패'; return; }
      
      if(notes.length === 0) {
        container.innerHTML = '<div style="color:#aaa; font-size:0.8rem;">기록된 특이사항이 없습니다.</div>';
        return;
      }

      container.innerHTML = notes.map(n => `
        <div class="thread-item">
          <div>${n.content ? n.content.replace(/\n/g, '<br>') : ''}</div>
          ${n.image_url ? `<img src="${n.image_url}" alt="첨부 이미지">` : ''}
          <div style="font-size:0.7rem; color:#888; text-align:right; margin-top:5px;">${new Date(n.created_at).toLocaleString()}</div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    async function addNote(event, vehicleId) {
      if (!supabaseClient) return;
      const content = document.getElementById(`note-text-${vehicleId}`).value;
      const fileInput = document.getElementById(`note-file-${vehicleId}`);
      const file = fileInput.files[0];
      
      if (!content && !file) return alert('내용을 입력하거나 이미지를 첨부해주세요.');
      
      const btn = event.target;
      btn.innerText = '업로드 중...';
      btn.disabled = true;

      let imageUrl = null;
      if (file) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Math.random()}.${fileExt}`;
        const filePath = `notes/${fileName}`;

        const { data: uploadData, error: uploadError } = await supabaseClient.storage.from('vehicle-images').upload(filePath, file);
        if (uploadError) { 
          alert('이미지 업로드 실패. 버킷 권한(Public)을 확인하세요.'); 
          btn.innerText = '기록 저장'; 
          btn.disabled = false; 
          return; 
        }
        
        const { data: publicUrlData } = supabaseClient.storage.from('vehicle-images').getPublicUrl(filePath);
        imageUrl = publicUrlData.publicUrl;
      }

      const { error } = await supabaseClient.from('vehicle_notes').insert([{ vehicle_id: vehicleId, content: content, image_url: imageUrl }]);
      
      btn.innerText = '기록 저장';
      btn.disabled = false;

      if (error) {
        alert('기록 저장 중 오류가 발생했습니다.');
      } else {
        document.getElementById(`note-text-${vehicleId}`).value = '';
        fileInput.value = '';
        loadNotes(vehicleId);
      }
    }
  </script>
</body>
</html>
