<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량 관리 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8 min-h-screen">

  <!-- 메인 차량 관리 화면 -->
  <div class="max-w-6xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h2 class="text-2xl font-bold text-slate-800">차량 정보 관리 시스템</h2>
      <span class="text-sm text-slate-500">인증 없이 누구나 접근 가능</span>
    </div>
    
    <!-- 차량 등록 폼 -->
    <div class="grid grid-cols-6 gap-4 mb-8 bg-slate-50 p-6 rounded-lg border">
      <input type="text" id="v-num" placeholder="차량번호 (예: 12가 3456)" class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input type="text" id="v-type" placeholder="차종 (예: 모닝)" class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input type="text" id="v-year" placeholder="연식 (예: 2022)" class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input type="text" id="v-vin" placeholder="차대번호" class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      <div class="flex flex-col justify-center">
        <span class="text-xs text-slate-500 mb-1">보험 만기일</span>
        <input type="date" id="v-date" class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <button id="add-btn" class="bg-blue-600 text-white font-bold p-2 rounded hover:bg-blue-700 transition">차량 등록하기</button>
    </div>

    <!-- 차량 목록 테이블 -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-200 text-slate-700">
            <th class="p-3 border font-semibold w-32">차량번호</th>
            <th class="p-3 border font-semibold w-24">차종</th>
            <th class="p-3 border font-semibold w-20">연식</th>
            <th class="p-3 border font-semibold w-40">차대번호</th>
            <th class="p-3 border font-semibold w-32">보험만기일</th>
            <th class="p-3 border font-semibold">특이사항 <span class="text-xs text-blue-600 font-normal">(클릭하여 바로 수정 후 엔터)</span></th>
            <th class="p-3 border font-semibold w-20 text-center">관리</th>
          </tr>
        </thead>
        <tbody id="vehicle-list">
          <!-- Firebase 데이터가 여기에 들어갑니다 -->
          <tr><td colspan="7" class="text-center p-8 text-slate-500">데이터를 불러오는 중입니다...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase 기능 불러오기 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ★ 여기에 본인의 Firebase 프로젝트 설정값을 넣으세요!
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 초기화 (인증 기능인 Auth는 삭제했습니다)
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 페이지가 열리자마자 바로 차량 목록을 불러옵니다
    loadVehicles();

    // 차량 등록 기능
    document.getElementById('add-btn').onclick = async () => {
      const vNum = document.getElementById('v-num').value;
      if(!vNum) return alert('차량번호는 필수 입력입니다.');

      document.getElementById('add-btn').innerText = '등록 중...';
      
      await addDoc(collection(db, 'vehicles'), {
        number: vNum,
        type: document.getElementById('v-type').value,
        year: document.getElementById('v-year').value,
        vin: document.getElementById('v-vin').value,
        insuranceDate: document.getElementById('v-date').value,
        note: "" // 특이사항은 처음엔 빈칸
      });

      // 입력창 초기화
      document.querySelectorAll('input').forEach(input => input.value = '');
      document.getElementById('add-btn').innerText = '차량 등록하기';
      
      loadVehicles(); // 등록 후 목록 다시 불러오기
    };

    // 차량 목록 불러오기 및 그리기 기능
    async function loadVehicles() {
      const snapshot = await getDocs(collection(db, 'vehicles'));
      const tbody = document.getElementById('vehicle-list');
      tbody.innerHTML = ''; // 기존 목록 비우기
      
      if(snapshot.empty) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center p-8 text-slate-500">등록된 차량이 없습니다.</td></tr>';
        return;
      }

      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition";
        
        // 테이블 내용 (특이사항 input창 포함)
        tr.innerHTML = `
          <td class="p-3 border">${data.number || '-'}</td>
          <td class="p-3 border">${data.type || '-'}</td>
          <td class="p-3 border">${data.year || '-'}</td>
          <td class="p-3 border text-xs text-slate-500">${data.vin || '-'}</td>
          <td class="p-3 border">${data.insuranceDate || '-'}</td>
          <td class="p-3 border bg-blue-50/30">
            <input type="text" value="${data.note || ''}" 
                   placeholder="특이사항 입력 (엔터시 저장)" 
                   class="w-full p-2 border border-transparent hover:border-slate-300 focus:border-blue-500 focus:outline-none bg-transparent transition rounded" 
                   onchange="updateNote('${docSnap.id}', this.value)">
          </td>
          <td class="p-3 border text-center">
             <button onclick="deleteVehicle('${docSnap.id}')" class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded hover:bg-red-200">삭제</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 전역 함수로 등록 (html 속성인 onclick, onchange에서 호출하기 위함)
    
    // 1. 특이사항 업데이트 기능
    window.updateNote = async (id, newNote) => {
      try {
        await updateDoc(doc(db, 'vehicles', id), { note: newNote });
        // 저장 성공 시 우측 하단 등에 작은 알림을 띄울 수도 있지만, 번거롭지 않게 alert은 뺐습니다.
      } catch (e) {
        alert('저장 실패: ' + e.message);
      }
    };

    // 2. 차량 삭제 기능 (보너스 추가)
    window.deleteVehicle = async (id) => {
      if(confirm('정말 이 차량 데이터를 삭제하시겠습니까?')) {
        await deleteDoc(doc(db, 'vehicles', id));
        loadVehicles(); // 삭제 후 새로고침
      }
    }
  </script>
</body>
</html>
