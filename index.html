<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차량 관리 시스템</title>
  <!-- Tailwind CSS 불러오기 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">

  <!-- 1. 로그인/회원가입 화면 -->
  <div id="auth-screen" class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md hidden">
    <h2 class="text-2xl font-bold mb-6 text-center" id="auth-title">로그인</h2>
    <div class="space-y-4">
      <input type="email" id="email" placeholder="이메일" class="w-full p-2 border rounded">
      <input type="password" id="password" placeholder="비밀번호" class="w-full p-2 border rounded">
      <button id="login-btn" class="w-full bg-blue-600 text-white p-2 rounded">로그인</button>
      <button id="signup-btn" class="w-full bg-slate-600 text-white p-2 rounded">회원가입 (승인요청)</button>
    </div>
  </div>

  <!-- 2. 승인 대기 화면 -->
  <div id="waiting-screen" class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md text-center hidden">
    <h2 class="text-2xl font-bold mb-4">승인 대기 중</h2>
    <p class="mb-6 text-slate-600">관리자의 승인이 필요합니다.</p>
    <button id="logout-btn-1" class="px-4 py-2 bg-slate-200 rounded">로그아웃</button>
  </div>

  <!-- 3. 메인 차량 관리 화면 -->
  <div id="main-screen" class="max-w-6xl mx-auto bg-white p-8 rounded-lg shadow-md hidden">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">차량 정보 관리 시스템</h2>
      <button id="logout-btn-2" class="px-4 py-2 bg-slate-200 rounded">로그아웃</button>
    </div>
    
    <!-- 차량 등록 폼 -->
    <div class="grid grid-cols-6 gap-4 mb-8 bg-slate-50 p-4 rounded">
      <input type="text" id="v-num" placeholder="차량번호" class="p-2 border rounded">
      <input type="text" id="v-type" placeholder="차종" class="p-2 border rounded">
      <input type="text" id="v-year" placeholder="연식" class="p-2 border rounded">
      <input type="text" id="v-vin" placeholder="차대번호" class="p-2 border rounded">
      <input type="date" id="v-date" class="p-2 border rounded">
      <button id="add-btn" class="bg-blue-600 text-white p-2 rounded">등록</button>
    </div>

    <!-- 차량 목록 테이블 -->
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-slate-200">
          <th class="p-3 border">차량번호</th>
          <th class="p-3 border">차종</th>
          <th class="p-3 border">연식</th>
          <th class="p-3 border">차대번호</th>
          <th class="p-3 border">보험만기일</th>
          <th class="p-3 border">특이사항 (클릭시 수정)</th>
        </tr>
      </thead>
      <tbody id="vehicle-list">
        <!-- 데이터가 여기에 들어갑니다 -->
      </tbody>
    </table>
  </div>

  <!-- Firebase 기능 불러오기 (npm 없이 사용) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ★ 여기에 본인의 Firebase 프로젝트 설정값을 넣으세요!
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 화면 전환 함수
    const show = (id) => {
      ['auth-screen', 'waiting-screen', 'main-screen'].forEach(screen => document.getElementById(screen).style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }

    // 로그인 상태 감지 및 승인 확인 (이전 요청하신 방법 B 적용)
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (userDoc.exists() && userDoc.data().isApproved) {
          show('main-screen');
          loadVehicles(); // 승인된 사용자만 차량 데이터 불러오기
        } else {
          show('waiting-screen');
        }
      } else {
        show('auth-screen');
      }
    });

    // 회원가입 (승인 대기 상태로 저장)
    document.getElementById('signup-btn').onclick = async () => {
      try {
        const userCred = await createUserWithEmailAndPassword(auth, email.value, password.value);
        await setDoc(doc(db, 'users', userCred.user.uid), { email: email.value, isApproved: false });
        alert('가입 완료! 관리자 승인을 기다려주세요.');
      } catch (e) { alert('오류: ' + e.message); }
    };

    // 로그인 및 로그아웃
    document.getElementById('login-btn').onclick = () => signInWithEmailAndPassword(auth, email.value, password.value).catch(e => alert('로그인 실패'));
    document.getElementById('logout-btn-1').onclick = () => signOut(auth);
    document.getElementById('logout-btn-2').onclick = () => signOut(auth);

    // 차량 등록
    document.getElementById('add-btn').onclick = async () => {
      await addDoc(collection(db, 'vehicles'), {
        number: document.getElementById('v-num').value,
        type: document.getElementById('v-type').value,
        year: document.getElementById('v-year').value,
        vin: document.getElementById('v-vin').value,
        insuranceDate: document.getElementById('v-date').value,
        note: ""
      });
      loadVehicles();
    };

    // 차량 목록 불러오기 및 특이사항 즉시 수정 기능
    async function loadVehicles() {
      const snapshot = await getDocs(collection(db, 'vehicles'));
      const tbody = document.getElementById('vehicle-list');
      tbody.innerHTML = '';
      
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3 border">${data.number}</td>
          <td class="p-3 border">${data.type}</td>
          <td class="p-3 border">${data.year}</td>
          <td class="p-3 border">${data.vin}</td>
          <td class="p-3 border">${data.insuranceDate}</td>
          <td class="p-3 border">
            <input type="text" value="${data.note}" class="w-full p-1 border-b focus:outline-none focus:border-blue-500 bg-transparent" onchange="updateNote('${docSnap.id}', this.value)">
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 특이사항 업데이트 함수 (글자 수정 후 마우스 바깥 클릭이나 엔터치면 자동 저장)
    window.updateNote = async (id, newNote) => {
      await updateDoc(doc(db, 'vehicles', id), { note: newNote });
      alert('특이사항이 저장되었습니다.');
    };
  </script>
</body>
</html>
