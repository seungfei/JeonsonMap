<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>❤️올해 좆된차 리스트❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --border:#dfe3e8; --text:#1c2024; --muted:#6b7280;
  --accent:#c0392b; --accent-soft:#f7e0dd;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --panel:#1d2126; --border:#2e343b; --text:#e8eaed; --muted:#9aa4b0;
    --accent:#ff6f5e; --accent-soft:#3a2320;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --panel:#1d2126; --border:#2e343b; --text:#e8eaed; --muted:#9aa4b0;
  --accent:#ff6f5e; --accent-soft:#3a2320;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
header{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 16px; border-bottom:1px solid var(--border); background:var(--panel);
  padding-top:calc(12px + env(safe-area-inset-top,0px));
}
header h1{font-size:19px; margin:0; font-weight:700; letter-spacing:-.02em; font-style:italic}
header .sub{color:var(--accent); font-size:14px; font-style:italic; font-weight:700}
header .spacer{flex:1}
@media (max-width:480px){
  header{gap:8px; padding:10px 12px}
  header h1{font-size:17px; width:100%}
  header .sub{font-size:13px}
  header .spacer{display:none}
}
button{font-family:inherit; font-size:14px; cursor:pointer}
.btn{
  border:1px solid var(--border); background:var(--panel); color:var(--text);
  border-radius:8px; padding:8px 12px; min-height:38px;
  transition:background .15s,border-color .15s;
}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent}

/* ---------- 레이아웃 ---------- */
.layout{display:flex; gap:16px; padding:16px; align-items:flex-start}
.card{background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow)}
.map-wrap{flex:1 1 460px; min-width:0; width:100%; padding:10px; position:relative}
.side{flex:0 0 380px; max-width:100%; display:flex; flex-direction:column; gap:16px}
#map{
  width:100%; height:min(72vh,720px); min-height:360px;
  border-radius:10px; background:var(--bg);
}
@media (max-width:900px){
  /* column 방향에서는 align-items:flex-start 가 너비를 붕괴시키므로 stretch 로 되돌린다 */
  .layout{flex-direction:column; align-items:stretch; padding:12px; gap:12px}
  .map-wrap, .side{flex:0 0 auto; width:100%; max-width:100%}
  #map{height:60vh; min-height:300px}
  ul.list{max-height:none}
}
@supports (height:100dvh){
  @media (max-width:900px){ #map{height:60dvh} }
}
.hint{
  position:absolute; left:20px; top:20px; z-index:5; background:var(--panel);
  border:1px solid var(--border); border-radius:8px; padding:6px 10px;
  font-size:12px; color:var(--muted); pointer-events:none; box-shadow:var(--shadow);
  max-width:calc(100% - 100px);
}
.locbtn{
  position:absolute; right:20px; bottom:24px; z-index:5;
  background:var(--panel); border:1px solid var(--border); border-radius:999px;
  width:42px; height:42px; font-size:18px; line-height:1; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; color:var(--text);
}
.maperr{
  position:absolute; inset:10px; display:none; align-items:center; justify-content:center;
  text-align:center; padding:24px; color:var(--muted); font-size:14px; z-index:6;
  background:var(--bg); border-radius:10px; border:1px dashed var(--border);
}

/* ---------- 폼 / 목록 ---------- */
.sec{padding:16px}
.sec h2{font-size:14px; margin:0 0 12px; font-weight:700}
label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px}
input[type=text],input[type=datetime-local],textarea,select{
  width:100%; max-width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--text); font-family:inherit;
  font-size:16px; /* iOS 자동 확대 방지 */
}
textarea{min-height:84px; resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px}
.coord{font-size:12px; color:var(--muted); background:var(--bg); border:1px dashed var(--border);
  border-radius:8px; padding:8px 10px; margin-top:4px; word-break:break-all}
.row{display:flex; gap:8px; margin-top:14px}
.row .btn{flex:1; min-height:44px}
.err{color:var(--accent); font-size:12px; margin-top:8px; min-height:1em}

ul.list{list-style:none; margin:0; padding:0; max-height:430px; overflow:auto; -webkit-overflow-scrolling:touch}
ul.list li{
  border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px;
  cursor:pointer; transition:border-color .15s, background .15s;
}
ul.list li:hover{border-color:var(--accent)}
ul.list li.active{border-color:var(--accent); background:var(--accent-soft)}
.li-top{display:flex; gap:8px; align-items:baseline}
.li-no{color:var(--accent); font-weight:700; font-size:12px}
.li-title{font-weight:500; flex:1; word-break:break-word}
.li-time{font-size:12px; color:var(--muted); margin-top:2px; word-break:break-word}
.li-desc{font-size:13px; color:var(--muted); margin-top:6px; white-space:pre-wrap; word-break:break-word}
.li-acts{display:flex; gap:6px; margin-top:8px}
.li-acts .btn{padding:6px 12px; font-size:12px; min-height:34px}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:24px 0}
.toolbar{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap}
.toolbar input{flex:1 1 140px; min-width:0}
.toolbar select{flex:0 0 auto; width:auto}
.gm-info{color:#1c2024; font-size:13px; max-width:230px}
.gm-info b{display:block; font-size:14px; margin-bottom:2px}
.gm-info span{display:block; color:#6b7280; font-size:12px}
footer{color:var(--muted); font-size:12px; text-align:center; padding:8px 16px 28px}
</style>
</head>
<body>
<header>
  <h1>❤️올해 좆된차 리스트❤️</h1>
  <span class="sub">다음은 너다!!!</span>
  <span class="spacer"></span>
  <button class="btn btn-ghost" id="themeBtn" type="button">🌓 테마</button>
  <button class="btn btn-ghost" id="exportBtn" type="button">내보내기</button>
</header>

<div class="layout">
  <div class="card map-wrap">
    <div id="map"></div>
    <div class="hint" id="hint">지도를 탭해서 사고 위치를 찍으세요</div>
    <button class="locbtn" id="locBtn" type="button" title="내 위치">📍</button>
    <div class="maperr" id="maperr">
      구글 지도를 불러오지 못했습니다.<br>API 키 · 결제 설정 · 허용 리퍼러(도메인)를 확인해주세요.
    </div>
  </div>

  <div class="side">
    <div class="card sec">
      <h2 id="formTitle">새로운 사고 등록하기</h2>
      <label for="f-name">사건명 *</label>
      <input type="text" id="f-name" maxlength="80" placeholder="예) 강남대로 3중 추돌">
      <label for="f-time">발생 시간 *</label>
      <input type="datetime-local" id="f-time">
      <label for="f-desc">사고 내용</label>
      <textarea id="f-desc" maxlength="1000" placeholder="무슨 일이 있었는지 적어주세요"></textarea>
      <label>위치 (지도 클릭)</label>
      <div class="coord" id="coord">선택된 위치가 없습니다</div>
      <div class="err" id="err"></div>
      <div class="row">
        <button class="btn btn-primary" id="saveBtn" type="button">저장</button>
        <button class="btn" id="resetBtn" type="button">초기화</button>
      </div>
    </div>

    <div class="card sec">
      <h2>사고 목록 (<span id="count">0</span>)</h2>
      <div class="toolbar">
        <input type="text" id="search" placeholder="사건명 · 내용 검색">
        <select id="sort">
          <option value="time-desc">최신순</option>
          <option value="time-asc">오래된순</option>
          <option value="name">이름순</option>
        </select>
      </div>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty">등록된 사고가 없습니다.</div>
    </div>
  </div>
</div>
<footer>데이터는 이 브라우저(localStorage)에만 저장됩니다 · 지도 © Google</footer>

<script>
/* ===================== 상태 ===================== */
var KEY = "kr-crash-map:v2";
var events = [];
var draft = null;
var editingId = null;
var selectedId = null;

var map, geocoder, infoWindow, draftMarker;
var markers = {};
var isTouch = window.matchMedia("(pointer:coarse)").matches;
function isSmall(){ return window.innerWidth <= 900; }

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if (raw) events = JSON.parse(raw) || [];
  }catch(e){ events = []; }
  if (!Array.isArray(events)) events = [];
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(events)); }
  catch(e){ console.warn("저장 실패", e); }
}
function debounce(fn, ms){
  var t; return function(){ clearTimeout(t); t = setTimeout(fn, ms); };
}

/* ===================== 지도 ===================== */
var DARK_STYLE = [
  {elementType:"geometry",stylers:[{color:"#212a33"}]},
  {elementType:"labels.text.stroke",stylers:[{color:"#212a33"}]},
  {elementType:"labels.text.fill",stylers:[{color:"#9aa4b0"}]},
  {featureType:"administrative",elementType:"geometry",stylers:[{color:"#3a444f"}]},
  {featureType:"poi",elementType:"labels.text.fill",stylers:[{color:"#7d8794"}]},
  {featureType:"poi.park",elementType:"geometry",stylers:[{color:"#25352a"}]},
  {featureType:"road",elementType:"geometry",stylers:[{color:"#2c353f"}]},
  {featureType:"road.highway",elementType:"geometry",stylers:[{color:"#3d4652"}]},
  {featureType:"transit",elementType:"geometry",stylers:[{color:"#2a323b"}]},
  {featureType:"water",elementType:"geometry",stylers:[{color:"#0f151c"}]},
  {featureType:"water",elementType:"labels.text.fill",stylers:[{color:"#4d5a68"}]}
];
function isDark(){
  var t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function pinIcon(color){
  return {
    path: "M 0 0 C -6 -8 -9 -12 -9 -17 a 9 9 0 0 1 18 0 c 0 5 -3 9 -9 17 z",
    fillColor: color, fillOpacity: 1,
    strokeColor: "#ffffff", strokeWeight: 1.5,
    scale: isTouch ? 1.7 : 1.5,
    anchor: new google.maps.Point(0, 0),
    labelOrigin: new google.maps.Point(0, -17)
  };
}

function initMap(){
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 36.5, lng: 127.9 },
    zoom: isSmall() ? 6 : 7,
    minZoom: 5,
    gestureHandling: "greedy",          /* 모바일에서 한 손가락 이동 허용 */
    mapTypeControl: !isSmall(),
    streetViewControl: false,
    fullscreenControl: !isSmall(),
    zoomControl: !isTouch,
    clickableIcons: false,
    styles: isDark() ? DARK_STYLE : null
  });
  geocoder = new google.maps.Geocoder();
  infoWindow = new google.maps.InfoWindow({ maxWidth: isSmall() ? 250 : 320 });

  map.addListener("click", function(ev){
    setDraft(ev.latLng.lat(), ev.latLng.lng());
  });

  /* 화면 회전 · 주소창 접힘 · 레이아웃 변경 시 지도 크기 재계산 */
  var keep = map.getCenter();
  map.addListener("idle", function(){ keep = map.getCenter(); });
  var refresh = function(){
    if (!map) return;
    var c = keep;
    google.maps.event.trigger(map, "resize");
    if (c) map.setCenter(c);
  };
  window.addEventListener("resize", debounce(refresh, 250));
  window.addEventListener("orientationchange", function(){ setTimeout(refresh, 350); });
  if (window.ResizeObserver){
    new ResizeObserver(debounce(refresh, 250)).observe(document.getElementById("map"));
  }

  load();
  resetForm();
  renderMarkers();
  renderList();
  fitToEvents();
}
window.initMap = initMap;
window.gm_authFailure = function(){
  document.getElementById("maperr").style.display = "flex";
};
setTimeout(function(){
  if (!window.google || !window.google.maps){
    document.getElementById("maperr").style.display = "flex";
  }
}, 8000);

function fitToEvents(){
  if (!events.length) return;
  var b = new google.maps.LatLngBounds();
  events.forEach(function(e){ b.extend({ lat:e.lat, lng:e.lng }); });
  map.fitBounds(b, isSmall() ? 40 : 60);
  if (events.length === 1) map.setZoom(13);
}

/* ---------- 내 위치 ---------- */
document.getElementById("locBtn").addEventListener("click", function(){
  if (!map) return;
  if (!navigator.geolocation){ alert("이 브라우저는 위치 기능을 지원하지 않습니다."); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    map.panTo({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    map.setZoom(15);
  }, function(){
    alert("위치를 가져오지 못했습니다. 위치 권한을 확인해주세요.\n(https 또는 localhost 에서만 동작합니다)");
  }, { enableHighAccuracy:true, timeout:8000 });
});

/* ---------- 임시(드래프트) 핀 ---------- */
function setDraft(lat, lng){
  draft = { lat: lat, lng: lng, addr: "" };
  if (draftMarker) draftMarker.setMap(null);
  draftMarker = new google.maps.Marker({
    position: { lat: lat, lng: lng },
    map: map,
    icon: pinIcon("#f1c40f"),
    zIndex: 9999,
    animation: google.maps.Animation.DROP,
    draggable: true,
    title: "드래그해서 위치 조정"
  });
  draftMarker.addListener("dragend", function(ev){
    setDraft(ev.latLng.lat(), ev.latLng.lng());
  });
  renderCoord();
  reverseGeocode(lat, lng);
  /* 모바일에서는 자동 포커스 시 키보드가 올라와 지도가 가려지므로 스크롤만 유도 */
  if (isTouch || isSmall()){
    document.getElementById("formTitle").scrollIntoView({ behavior:"smooth", block:"start" });
  } else {
    document.getElementById("f-name").focus({ preventScroll:true });
  }
}
function reverseGeocode(lat, lng){
  if (!geocoder) return;
  geocoder.geocode({ location:{ lat:lat, lng:lng }, language:"ko" }, function(res, status){
    if (status === "OK" && res && res[0] && draft && Math.abs(draft.lat-lat) < 1e-9){
      draft.addr = res[0].formatted_address;
      renderCoord();
    }
  });
}

/* ---------- 사고 핀 ---------- */
function renderMarkers(){
  if (!map) return;
  Object.keys(markers).forEach(function(k){ markers[k].setMap(null); });
  markers = {};
  sorted().forEach(function(e, idx){
    var m = new google.maps.Marker({
      position: { lat:e.lat, lng:e.lng },
      map: map,
      icon: pinIcon(e.id === selectedId ? "#f39c12" : "#c0392b"),
      label: { text: String(idx+1), color:"#ffffff", fontSize:"11px", fontWeight:"700" },
      title: e.name,
      zIndex: e.id === selectedId ? 999 : idx
    });
    m.addListener("click", function(){ select(e.id, true); openInfo(e, m); });
    markers[e.id] = m;
  });
}
function openInfo(e, m){
  if (!infoWindow) return;
  infoWindow.setContent(
    '<div class="gm-info"><b>' + esc(e.name) + '</b>'
    + '<span>🕑 ' + esc(fmt(e.time)) + '</span>'
    + (e.addr ? '<span>📍 ' + esc(e.addr) + '</span>' : '')
    + (e.desc ? '<div style="margin-top:6px;white-space:pre-wrap">' + esc(e.desc) + '</div>' : '')
    + '</div>'
  );
  infoWindow.open({ map: map, anchor: m });
}

/* ===================== 목록 ===================== */
function sorted(){
  var q = document.getElementById("search").value.trim().toLowerCase();
  var mode = document.getElementById("sort").value;
  var arr = events.filter(function(e){
    if (!q) return true;
    return (e.name + " " + (e.desc||"") + " " + (e.addr||"")).toLowerCase().indexOf(q) >= 0;
  });
  arr.sort(function(a,b){
    if (mode === "name") return a.name.localeCompare(b.name, "ko");
    if (mode === "time-asc") return (a.time||"").localeCompare(b.time||"");
    return (b.time||"").localeCompare(a.time||"");
  });
  return arr;
}
function fmt(t){
  if (!t) return "시간 미기재";
  var d = new Date(t);
  if (isNaN(d.getTime())) return t;
  var p = function(n){ return n < 10 ? "0"+n : ""+n; };
  return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function renderList(){
  var arr = sorted();
  var ul = document.getElementById("list");
  document.getElementById("count").textContent = events.length;
  document.getElementById("empty").style.display = arr.length ? "none" : "block";
  ul.innerHTML = arr.map(function(e, i){
    return '<li data-id="'+e.id+'" class="'+(e.id===selectedId?"active":"")+'">'
      + '<div class="li-top"><span class="li-no">'+(i+1)+'</span>'
      + '<span class="li-title">'+esc(e.name)+'</span></div>'
      + '<div class="li-time">🕑 '+esc(fmt(e.time))+'</div>'
      + '<div class="li-time">📍 '+esc(e.addr || (e.lat.toFixed(4)+", "+e.lng.toFixed(4)))+'</div>'
      + (e.desc ? '<div class="li-desc">'+esc(e.desc)+'</div>' : '')
      + '<div class="li-acts"><button class="btn" data-act="edit">수정</button>'
      + '<button class="btn" data-act="del">삭제</button></div></li>';
  }).join("");
}
document.getElementById("list").addEventListener("click", function(ev){
  var li = ev.target.closest("li"); if (!li) return;
  var id = li.getAttribute("data-id");
  var act = ev.target.getAttribute("data-act");
  if (act === "edit") return startEdit(id);
  if (act === "del") return remove(id);
  select(id, false);
});

function select(id, fromMap){
  selectedId = (selectedId === id && !fromMap) ? null : id;
  renderMarkers(); renderList();
  var e = events.filter(function(x){ return x.id === selectedId; })[0];
  if (e && !fromMap && map){
    map.panTo({ lat:e.lat, lng:e.lng });
    if (map.getZoom() < 12) map.setZoom(13);
    if (markers[e.id]) openInfo(e, markers[e.id]);
    if (isSmall()) document.getElementById("map").scrollIntoView({ behavior:"smooth", block:"center" });
  }
  if (fromMap){
    var li = document.querySelector('li[data-id="'+selectedId+'"]');
    if (li) li.scrollIntoView({ block:"nearest", behavior:"smooth" });
  }
}

/* ===================== 폼 ===================== */
function renderCoord(){
  var el = document.getElementById("coord");
  if (!draft){ el.textContent = "선택된 위치가 없습니다"; return; }
  el.textContent = (draft.addr ? draft.addr + "  ·  " : "")
    + draft.lat.toFixed(5) + ", " + draft.lng.toFixed(5);
}
function nowLocal(){
  var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
function resetForm(){
  editingId = null; draft = null;
  if (draftMarker){ draftMarker.setMap(null); draftMarker = null; }
  document.getElementById("f-name").value = "";
  document.getElementById("f-desc").value = "";
  document.getElementById("f-time").value = nowLocal();
  document.getElementById("formTitle").textContent = "새로운 사고 등록하기";
  document.getElementById("saveBtn").textContent = "저장";
  document.getElementById("err").textContent = "";
  renderCoord();
}
function startEdit(id){
  var e = events.filter(function(x){ return x.id === id; })[0];
  if (!e) return;
  setDraft(e.lat, e.lng);
  draft.addr = e.addr || "";
  editingId = id;
  document.getElementById("f-name").value = e.name;
  document.getElementById("f-desc").value = e.desc || "";
  document.getElementById("f-time").value = e.time || "";
  document.getElementById("formTitle").textContent = "사고 수정하기";
  document.getElementById("saveBtn").textContent = "수정 저장";
  renderCoord();
  map.panTo({ lat:e.lat, lng:e.lng });
  document.getElementById("formTitle").scrollIntoView({ behavior:"smooth", block:"start" });
}
function remove(id){
  if (!confirm("이 사고 기록을 삭제할까요?")) return;
  events = events.filter(function(x){ return x.id !== id; });
  if (selectedId === id) selectedId = null;
  if (editingId === id) resetForm();
  save(); renderMarkers(); renderList();
}
document.getElementById("saveBtn").addEventListener("click", function(){
  var name = document.getElementById("f-name").value.trim();
  var time = document.getElementById("f-time").value;
  var desc = document.getElementById("f-desc").value.trim();
  var err = document.getElementById("err");
  if (!name){ err.textContent = "사건명을 입력해주세요."; return; }
  if (!time){ err.textContent = "발생 시간을 입력해주세요."; return; }
  if (!draft){ err.textContent = "지도를 탭(클릭)해 위치를 선택해주세요."; return; }
  err.textContent = "";
  var payload = { name:name, desc:desc, time:time, lat:draft.lat, lng:draft.lng, addr:draft.addr || "" };
  if (editingId){
    var keepId = editingId;
    events = events.map(function(e){
      return e.id === keepId ? Object.assign({ id:keepId }, payload) : e;
    });
    selectedId = keepId;
  } else {
    var id = "e" + Date.now() + Math.random().toString(36).slice(2,6);
    events.push(Object.assign({ id:id }, payload));
    selectedId = id;
  }
  save(); resetForm(); renderMarkers(); renderList();
});
document.getElementById("resetBtn").addEventListener("click", resetForm);
document.getElementById("search").addEventListener("input", function(){ renderMarkers(); renderList(); });
document.getElementById("sort").addEventListener("change", function(){ renderMarkers(); renderList(); });

/* ===================== 테마 / 내보내기 ===================== */
document.getElementById("themeBtn").addEventListener("click", function(){
  var next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(KEY+":theme", next); }catch(e){}
  if (map) map.setOptions({ styles: next === "dark" ? DARK_STYLE : null });
});
try{
  var savedTheme = localStorage.getItem(KEY+":theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
}catch(e){}

document.getElementById("exportBtn").addEventListener("click", function(){
  var text = JSON.stringify(events, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      alert("사고 데이터(JSON)를 클립보드에 복사했습니다.");
    }, function(){ prompt("아래 내용을 복사하세요", text); });
  } else {
    prompt("아래 내용을 복사하세요", text);
  }
});
